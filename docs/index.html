<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Machine Learning Methods</title>

    <style>
        :root {
            --primary: #1a73e8;
            --dark: #1f2933;
            --light: #f5f7fa;
            --gray: #6b7280;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 0;
            color: var(--dark);
        }

        header {
            background: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 1px solid #e5e7eb;
        }

        header h1 {
            margin: 0;
            font-size: 2.6rem;
        }

        header p {
            margin-top: 15px;
            font-size: 1.1rem;
            color: var(--gray);
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        section {
            margin-bottom: 70px;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
        }

        .diagram {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-top: 0;
        }

        .card a {
            text-decoration: none;
            color: var(--primary);
            font-weight: 600;
        }

        footer {
            background: #111827;
            color: #d1d5db;
            padding: 40px 20px;
            text-align: center;
            font-size: 0.9rem;
        }

        footer a {
            color: #93c5fd;
            text-decoration: none;
        }

    </style>
</head>

<header>
    <h1>Machine Learning Methods</h1>
    <p>
        A concise and practical overview of fundamental Machine Learning techniques,
        focusing on the difference between regression and classification models,
        their training pipeline, and evaluation metrics.
    </p>
</header>
